spring.application.name=service-turns
server.port=${SERVER_PORT:8081}

# PostgreSQL propio de service-turns
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/turns_db}
spring.datasource.username=${DB_USER:turns_user}
spring.datasource.password=${DB_PASSWORD:turns_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: el esquema lo manejan solo las migraciones de Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Kafka (local: contenedor del compose; real: valores de la integracion de catedra)
spring.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
spring.kafka.consumer.group-id=${CATEDRA_KAFKA_CONSUMER_GROUP_ID:alumnos-local-turns}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
catedra.kafka.appointment-actions-topic=${CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC:alumnos.turnos.acciones.local}
catedra.kafka.appointment-phone-topic=${CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC:catedra.turnos.telefono.local}

# API REST de la catedra (sin valores reales en el repositorio)
catedra.api.base-url=${CATEDRA_API_BASE_URL:}
catedra.api.jwt-token=${CATEDRA_JWT_TOKEN:}

# Tiempos de espera de la API REST de la catedra
catedra.api.connect-timeout-ms=${CATEDRA_API_CONNECT_TIMEOUT_MS:5000}
catedra.api.read-timeout-ms=${CATEDRA_API_READ_TIMEOUT_MS:10000}

# service-catalog (API interna)
catalog.api.base-url=${CATALOG_API_BASE_URL:http://localhost:8080}
catalog.api.connect-timeout-ms=${CATALOG_API_CONNECT_TIMEOUT_MS:2000}
catalog.api.read-timeout-ms=${CATALOG_API_READ_TIMEOUT_MS:5000}

# JWT: secreto Base64 (minimo 64 bytes), el MISMO que usa service-catalog, que es quien emite los tokens.
jwt.secret=${JWT_SECRET:}

# CORS: lista de origenes permitidos separados por comas. Vacia por defecto: no se permite ningun origen.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}