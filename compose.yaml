services:
  turns-db:
    image: postgres:16-alpine
    container_name: turns-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turns_db}
      POSTGRES_USER: ${POSTGRES_USER:-turns_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turns_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - turns_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turns_user} -d ${POSTGRES_DB:-turns_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka en modo KRaft (sin ZooKeeper), un solo nodo, solo para pruebas locales.
  # En el entorno real se usa el Kafka central de la catedra. Puerto 9095 para no chocar con el de service-catalog.
  turns-kafka:
    image: apache/kafka:3.9.0
    container_name: turns-kafka
    restart: unless-stopped
    ports:
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9095,CONTROLLER://:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9096
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9095 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  turns_db_data: